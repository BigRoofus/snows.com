<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<style>
	* { box-sizing: border-box; margin: 0; padding: 0; }

	html, body {
		width: 100%;
		height: 100%;
		overflow: hidden;
		background: transparent;
	}

	canvas {
		display: block;
		background-color: transparent;
	}

	#snowCanvas {
		width: 100vw;
		height: 100vh;
	}
</style>
</head>
<body>

<canvas id="snowCanvas"></canvas>

<script>
const canvas = document.getElementById('snowCanvas');
const ctx = canvas.getContext('2d');
const snowColor = "#ff90ae";

let numParticles = 60;
const minParticles = 3;
const maxParticles = 150;
const changeAmount = 10;
let changeInterval = 4000;

let targetWind = 15;
let currentWind = 5;
const minWind = -20;
const maxWind = 35;

let lastChangeTime = 0;
let particles = [];

class Particle {
	constructor() {
		this.reset();
	}

	reset() {
		const factor = Math.random();
		this.size = factor * 47 + 3;
		this.speed = factor * 4 + 0.001;

		this.x = Math.random() * canvas.width;
		this.y = -Math.random() * canvas.height;
		this.windSensitivity = Math.random() * 0.3 + 0.1;
		this.windAccel = Math.random() * 0.002 + 0.001;
		this.currentWindEffect = 0;
	}

	update() {
		this.y += this.speed;

		this.currentWindEffect += this.windAccel;

		const randomChange = (Math.random() - 0.5) * 0.02;
		const windEffect = currentWind * this.windSensitivity * this.currentWindEffect;
		this.x += windEffect + randomChange;

		if (this.x < -this.size) this.x = canvas.width + this.size;
		if (this.x > canvas.width + this.size) this.x = -this.size;

		if (this.y > canvas.height + this.size) this.reset();
	}

	draw() {
		ctx.fillStyle = snowColor;
		ctx.fillRect(this.x, this.y, this.size, this.size);
	}
}

function adjustParticles() {
	const change = Math.random() < 0.5 ? changeAmount : -changeAmount;
	const newTarget = Math.max(minParticles, Math.min(maxParticles, numParticles + change));

	const diff = newTarget - particles.length;
	if (diff > 0) {
		for (let i = 0; i < diff; i++) particles.push(new Particle());
	} else if (diff < 0) {
		const toRemove = -diff;
		const bottomParticles = particles.filter(p => p.y > canvas.height * 1.1);

		if (bottomParticles.length >= toRemove) {
			for (let i = 0; i < toRemove; i++) {
				const index = particles.indexOf(bottomParticles[i]);
				if (index > -1) particles.splice(index, 1);
			}
		}
	}

	numParticles = newTarget;
}

function init() {
	canvas.width = window.innerWidth;
	canvas.height = window.innerHeight;
	particles = [];
	for (let i = 0; i < numParticles; i++) {
		particles.push(new Particle());
	}
}

function animate() {
	const now = Date.now();

	if (now - lastChangeTime > changeInterval) {
		adjustParticles();
		lastChangeTime = now;
	}

	ctx.clearRect(0, 0, canvas.width, canvas.height);

	currentWind += (targetWind - currentWind) * 0.01;

	particles.forEach(p => {
		p.update();
		p.draw();
	});

	requestAnimationFrame(animate);
}

function changeWind() {
	targetWind = Math.random() < 0.7 ?
		Math.random() * (maxWind - minWind) + minWind :
		1.5;
	setTimeout(changeWind, Math.random() * 8000 + 3000);
}

window.addEventListener('resize', init);

init();
animate();
changeWind();
</script>

</body>
</html>
