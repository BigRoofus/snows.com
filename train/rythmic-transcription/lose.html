<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="../../css/default.css">
    <link rel="stylesheet" href="slime.css">
	
	<title>Incorrect Message</title>
</head>

<body style="text-align: center;">
    <div class="slime"></div>
	<div style="height:10vh;">&nbsp;</div>
    <div class="message">
        <p>💀</p>
        <div>No, try again!</div>
        <p>the correct sequence was:</p>
        <p id="correct-sequence"></p>
        <p>your guess:</p>
        <p id="user-guess"></p>
        <p id="losing-points"></p>
    </div>
</body>

<script>
    const correctSequence = sessionStorage.getItem("correctSequence") || "N/A";
    const userGuess = sessionStorage.getItem("userGuess") || "You did not make a guess!";
    const losingPoints = sessionStorage.getItem("losingPoints") || 1;
    const reloadWindowTime = sessionStorage.getItem("reloadWindowTime") || 1000;
    const reloadMultiplier = sessionStorage.getItem("reloadMultiplier") || 1.3;

    // Display variables
    document.getElementById("correct-sequence").innerHTML = correctSequence.replace(/,/g, ' ');
    document.getElementById('user-guess').textContent = userGuess.replace(/,/g, ' ');
    document.getElementById('losing-points').textContent = `-${losingPoints}`;

    setTimeout(function () {
        window.location.href = 'index.html';
    }, reloadWindowTime * reloadMultiplier);  // Wait longer if user loses
</script>

</html>
