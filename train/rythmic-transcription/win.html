<script>
    const winningPoints = sessionStorage.getItem("winningPoints") || 2;
    const userGuess = sessionStorage.getItem("userGuess") || "N/A";
    const reloadWindowTime = sessionStorage.getItem("reloadWindowTime") || 1000;

    document.getElementById('user-guess').textContent = userGuess.replace(/,/g, ' ');
    document.getElementById('winning-points').textContent = `+${winningPoints}!`;
    
    setTimeout(function () {
        window.location.href = "index.html";
    }, reloadWindowTime);
</script>
