<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">

	<link rel="stylesheet" href="../../css/default.css">

	<title>Rhythm Transcription Practice2</title>

</head>

<body style="text-align: center; align-items: center;">

	<div class="filter"></div>

	<div class="corner-div">
		<a href="../index.html" class="NavFont">
			<img src="../../img/homeIcon.svg" height="20px" width="20px">
		</a>
	</div>

	<div style="height:20vh;">&nbsp;</div>

	<h1>RhytGeor! <button onclick="playSequence(correctSequence)">▶</button></h1>
	<p>(1 bar of 4/4)</p>

	<div id="guess">?</div>

	<!-- Add musical symbols to the guess -->
	<div id="buttons" style="margin:10px;">
		<button onclick="addSymbolToGuess('𝅗𝅥')">𝅗𝅥</button>
		<button onclick="addSymbolToGuess('𝅘𝅥')">𝅘𝅥</button>
		<button onclick="addSymbolToGuess('𝅘𝅥𝅮')">𝅘𝅥𝅮</button>
		<button onclick="backspace()">🡐</button>
	</div>

	<!-- Submit button to check the guess -->
	<button onclick="checkGuess()">Submit Guess ✔</button>

	<div class="score">
		<p>score:</p>
		<p id="score">&nbsp;</p>
	</div>

	<footer id="footer">
		<!-- copyright -->
	</footer>

	<script>
		const currentYear = new Date().getFullYear();
		document.getElementById('footer').textContent = `© ${currentYear}`;
	</script>

	<script src="https://unpkg.com/tone"></script>

	<script src="rhythmTranscription.js"></script>
</body>

</html>
