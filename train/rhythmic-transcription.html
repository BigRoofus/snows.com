<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="index, follow" />
    <meta name="theme-color" content="#1a1a1a" />
    <link rel="canonical" href="https://itsnowsinaustralia.com/train/rhythmic-transcription.html" />

    <link rel="stylesheet" href="/css/app.css" />
    <link rel="stylesheet" href="/train/rhythmic-transcription.css" />

    <title>Rhythmic Transcription | It Snows In Australia</title>
  </head>
  <body>
    <canvas id="snowCanvas"></canvas>

    <div class="filter"></div>

    <div class="nav-menu">
      <button class="nav-toggle" aria-label="Open navigation" aria-expanded="false">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <rect x="3" y="3" width="5" height="5" rx="1" fill="currentColor" />
          <rect x="10" y="3" width="5" height="5" rx="1" fill="currentColor" />
          <rect x="17" y="3" width="5" height="5" rx="1" fill="currentColor" />
          <rect x="3" y="10" width="5" height="5" rx="1" fill="currentColor" />
          <rect x="10" y="10" width="5" height="5" rx="1" fill="currentColor" />
          <rect x="17" y="10" width="5" height="5" rx="1" fill="currentColor" />
          <rect x="3" y="17" width="5" height="5" rx="1" fill="currentColor" />
          <rect x="10" y="17" width="5" height="5" rx="1" fill="currentColor" />
          <rect x="17" y="17" width="5" height="5" rx="1" fill="currentColor" />
        </svg>
      </button>
      <nav class="nav-dropdown">
        <a href="/index.html">Home</a>
        <a href="/about.html">About</a>
        <a href="/train/index.html">Train</a>
        <a href="/train/abstract-tactics.html">Abstract Tactics</a>
        <a href="/train/rhythmic-transcription.html">Rhythmic Transcription</a>
        <a href="/train/theory-tabs.html">Theory Tablature</a>
      </nav>
    </div>

    <div id="win-view" class="container" hidden>
      <div class="fireworks" id="fireworks">
        <div class="firework firework-1"></div>
        <div class="firework firework-2"></div>
        <div class="firework firework-3"></div>
        <div class="firework firework-4"></div>
        <div class="firework firework-5"></div>
        <div class="firework firework-6"></div>
        <div class="firework firework-7"></div>
        <div class="firework firework-8"></div>
        <div class="firework firework-9"></div>
        <div class="firework firework-10"></div>
        <div class="firework firework-11"></div>
        <div class="firework firework-12"></div>
        <div class="firework firework-13"></div>
        <div class="firework firework-14"></div>
        <div class="firework firework-15"></div>
        <div class="firework firework-16"></div>
        <div class="firework firework-17"></div>
        <div class="firework firework-18"></div>
        <div class="firework firework-19"></div>
        <div class="firework firework-20"></div>
      </div>
      <div style="height:20vh;">&nbsp;</div>
      <div class="message">
        <p>&#128076;</p>
        <p>Correct!</p>
        <p id="win-points"></p>
        <p id="win-guess"></p>
      </div>
    </div>

    <div id="lose-view" class="container" hidden>
      <div class="slime"></div>
      <div style="height:10vh;">&nbsp;</div>
      <div class="message">
        <p>&#128128;</p>
        <div>No, try again!</div>
        <p>the correct sequence was:</p>
        <p id="lose-correct"></p>
        <p>your guess:</p>
        <p id="lose-guess"></p>
        <p id="lose-points"></p>
      </div>
    </div>

    <div id="play-view" class="container">
      <div style="height:20vh;">&nbsp;</div>

      <h1>RhytGeor! <button id="play-btn">&#9654;</button></h1>
      <p>(1 bar of 4/4)</p>

      <div id="guess">?</div>

      <div id="buttons" style="margin:10px;">
        <button data-symbol="𝅗𝅥">𝅗𝅥</button>
        <button data-symbol="𝅘𝅥">𝅘𝅥</button>
        <button data-symbol="𝅘𝅥𝅮">𝅘𝅥𝅮</button>
        <button id="backspace-btn">&#128592;</button>
      </div>

      <button id="submit-btn">Submit Guess &#10003;</button>

      <div class="score">
        <p>score:</p>
        <p id="score-display"></p>
      </div>
    </div>

    <footer>
      <div class="footer-inner">
        <span>&copy;<span class="footer-year"></span> Modest Records Nashville</span>
      </div>
    </footer>

    <script src="/js/footer.js"></script>
    <script src="/js/nav.js"></script>
    <script src="/js/snow.js"></script>
    <script type="module" src="/train/rhythmic-transcription.js"></script>
  </body>
</html>
