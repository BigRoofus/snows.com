<!-- ABSTRACT TACTICS index.html -->
<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">

	<link rel="stylesheet" href="../../css/default.css">

	<style>
		button {
			font-size: 5rem;
			background: transparent;
			color: #fff;
			margin-top: -50px;
			cursor: pointer;
		}

		button:hover {
			background: transparent;
		}
	</style>

	<title>Abstract Tactics</title>
</head>

<body>

	<div class="filter"></div>

	<div class="corner-div">
		<a href="../index.html" class="NavFont">
			<img src="../../img/homeIcon.svg" height="20px" width="20px">
		</a>
	</div>

	<div class="full-center">
		<div id="tactic">&nbsp;</div>
		<button style="font-size: 200%; margin-top:-0.1vh;" onclick="reload()">↻</button>
	</div>



	<footer id="footer"><!-- copyright --></footer>

	<script src="dataLoader.js"></script>
	<script src="../js/printCopyright.js"></script>

	<script>
		function reload() {
			location.reload();
		}

		function shuffleArray(array) {
			for (let i = array.length - 1; i > 0; i--) {
				const randomIndex = Math.floor(Math.random() * (i + 1));
				[array[i], array[randomIndex]] = [array[randomIndex], array[i]];
			}
			return array;
		}

		function displayTactic() {
			console.log('shuffledArray: ' + shuffledArray);
			document.getElementById("tactic").textContent = `${shuffledArray[currentIndex]}`;
			currentIndex++;
			if (currentIndex >= shuffledArray.length) currentIndex = 0;
			localStorage.setItem("currentIndex", currentIndex);
		}

		const savedArray = localStorage.getItem("shuffledArray");
		const savedIndex = parseInt(localStorage.getItem("currentIndex"), 10) || 0;
		let shuffledArray = savedArray ? JSON.parse(savedArray) : null;
		let currentIndex = savedIndex;

		if (!shuffledArray) {
			const loader = new DataLoader('abstract-tactics.txt');
			loader.loadData((error, data) => {
				if (error) {
					console.error("Error loading data:", error);
				} else {
					shuffledArray = shuffleArray(data);
					currentIndex = 0;
					localStorage.setItem("shuffledArray", JSON.stringify(shuffledArray));
					localStorage.setItem("currentIndex", currentIndex);
					displayTactic();
				}
			});
		} else {
			displayTactic();
		}
	</script>
</body>

</html>
